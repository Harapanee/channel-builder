<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>hf-smoke</title>
<style>
  @font-face { font-family: "Hiragino Sans"; src: local("Hiragino Sans"); }
  html, body { margin: 0; padding: 0; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; background: #f5efe0; overflow: hidden; font-family: "Hiragino Sans", sans-serif; }
  .title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; color: #333; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="hf-smoke" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div class="clip scene" id="s1" data-start="0" data-duration="10" data-track-index="1">
    <div class="title" id="smoke-title">HyperFrames スモーク</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#smoke-title", { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.5);
  window.__timelines["hf-smoke"] = tl;
</script>
</body>
</html>
